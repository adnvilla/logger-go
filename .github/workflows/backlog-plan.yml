name: Apply backlog plan

# Runs when the plan changes on master or on manual dispatch.
# Syncs labels, phase milestones (Phases 0-5) and issue assignments from
# .github/scripts/apply-backlog-plan.py. The script is idempotent and never
# reopens closed issues or milestones, so re-running it is safe.
on:
  push:
    branches:
      - master
    paths:
      - .github/scripts/apply-backlog-plan.py
      - .github/workflows/backlog-plan.yml
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: backlog-plan
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply labels, phase milestones and issue assignments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/apply-backlog-plan.py
