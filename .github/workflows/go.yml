# This workflow will build a golang project
# Uses the reusable workflow from adnvilla/gha-toolkit
# For more information see: https://github.com/adnvilla/gha-toolkit
#
# Phase work lands on phase integration branches (phase-N/main) through
# stacked PRs (phase-N/<issue>-<slug>), so CI runs for PRs into any of them.
# See docs/RELEASING.md.

name: Go

on:
  push:
    branches: [ "master", "phase-*/main" ]
  pull_request:
    branches: [ "master", "phase-*/**" ]

jobs:
  build-and-test:
    uses: adnvilla/gha-toolkit/.github/workflows/go-base.yml@v1.1.1
    with:
      go-version: '1.24'
      test-flags: '-v -race -cover'

  # The Zap bridge is its own module (zap/go.mod), which the reusable
  # workflow above does not visit.
  zap-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zap
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: zap/go.sum

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -cover ./...
